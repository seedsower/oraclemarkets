[toolchain]
anchor_version = "1.0.1"
solana_version = "3.0.14"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
pm_amm = "97ySR6vWkxCC1oPbB2ytRSmKos4mExanuTu2e9VmoXcX"

[programs.localnet]
pm_amm = "97ySR6vWkxCC1oPbB2ytRSmKos4mExanuTu2e9VmoXcX"

[programs.mainnet]
pm_amm = "97ySR6vWkxCC1oPbB2ytRSmKos4mExanuTu2e9VmoXcX"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 3000000 tests/*.ts tests/lifecycle/*.ts"

[hooks]

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
url = "https://api.devnet.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899

[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
